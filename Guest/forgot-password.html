<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quên mật khẩu | Macoliz Box</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/forgot.css" />
</head>

<body class="auth-page">
  <div class="forgot-wrapper">

    <!-- Logo -->
    <div class="brand-logo">
      <div class="brand-icon">🎵</div>
      <span class="brand-primary">MACOLIZ</span>
      <span class="brand-secondary">BOX</span>
    </div>

    <!-- Card -->
    <div class="forgot-card">
      <h1>Quên mật khẩu</h1>
      <p class="subtitle">
        Tài khoản được cấp bởi quản trị viên hệ thống.
        <br />
        Vui lòng gửi yêu cầu để được cấp lại mật khẩu.
      </p>

      <!-- Form -->
      <form id="forgotForm">
        <input
          type="text"
          placeholder="Tên đăng nhập hoặc Email"
          required
        />

        <button type="submit">
          Gửi yêu cầu tới quản trị viên
        </button>
      </form>

      <!-- Back -->
      <p class="back-login">
        Nhớ lại mật khẩu?
        <a href="login.html">Quay lại đăng nhập</a>
      </p>
    </div>

  </div>

  <!-- JS -->
  <script src="js/auth.js"></script>
</body>
</html>
