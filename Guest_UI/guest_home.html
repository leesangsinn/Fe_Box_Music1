<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Macoliz Home</title>

    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        lucide.createIcons();
    </script>

    <style>
        * {
            box-sizing: border-box;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            background:
                radial-gradient(circle at top, #111c33, #050814);
            color: #fff;
        }

        .app {
            width: 390px;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .header {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 22px;
        }

        .room {
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 14px;
            border-radius: 999px;
            font-size: 13px;
        }

        .room small {
            display: block;
            font-size: 11px;
            color: #22d3ee;
            margin-top: 2px;
        }


        /* ===== GREETING ===== */
        .greeting h1 {
            font-size: 26px;
            margin: 0;
            line-height: 1.2;
        }

        .greeting span {
            color: #ff5ea8;
        }

        .greeting p {
            font-size: 13px;
            color: #94a3b8;
            margin-top: 6px;
        }

        /* ===== MAIN CARD ===== */
        .main-card {
            margin-top: 24px;
            padding: 22px;
            border-radius: 22px;
            background: linear-gradient(160deg, #1b1f3b, #0b0f1f);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.08),
                0 20px 40px rgba(0, 0, 0, 0.5);
        }

        .main-icon {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: linear-gradient(135deg, #ff5ea8, #ff3d81);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 14px;
        }

        .main-card h2 {
            margin: 0;
            font-size: 18px;
        }

        .main-card p {
            margin-top: 6px;
            font-size: 13px;
            color: #cbd5f5;
        }

        /* ===== ACTION CARDS ===== */
        .actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 18px;
        }

        .action-card {
            padding: 16px;
            border-radius: 18px;
            background: linear-gradient(180deg, #0f172a, #020617);
            box-shadow:
                inset 0 0 0 1px rgba(255, 255, 255, 0.06);
        }

        .action-icon {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .icon-order {
            background: linear-gradient(135deg, #22d3ee, #06b6d4);
        }

        .icon-support {
            background: linear-gradient(135deg, #f59e0b, #f97316);
        }

        .action-card h3 {
            margin: 0;
            font-size: 14px;
        }

        .action-card p {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
        }

        /* ===== SUGGEST ===== */
        .suggest {
            margin-top: 24px;
        }

        .suggest small {
            font-size: 12px;
            color: #94a3b8;
            display: block;
            margin-bottom: 10px;
        }

        .suggest-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            border-radius: 16px;
            background: linear-gradient(180deg, #0b1324, #020617);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .suggest-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .suggest-icon {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .suggest-card h4 {
            margin: 0;
            font-size: 14px;
        }

        .suggest-card p {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
        }

        .icon-box {
            width: 42px;
            height: 42px;
            border-radius: 14px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);

            backdrop-filter: blur(8px);
        }

        .icon-box svg {
            width: 20px;
            height: 20px;
            stroke: #f8fafc;
            stroke-width: 1.75;
        }

        
    </style>
</head>

<body>
    <div class="app">

        <!-- HEADER -->
        <div class="header">
            <div class="room">
                Phòng P101
                <small>ID: MBB829</small>
            </div>
            <div class="avatar"></div>
        </div>

        <!-- GREETING -->
        <div class="greeting">
            <h1>Xin chào,<br><span>Quý khách!</span></h1>
            <p>Chào mừng đến với Macoliz Box. Chúc bạn có những giây phút tuyệt vời ✨</p>
        </div>

        <!-- MAIN -->
        <div class="main-card" id="go-menu">
            <div class="icon-box" style="margin-bottom: 5mm;">
                <i data-lucide="utensils"></i>
            </div>
            <h2>Gọi Món & Đồ Uống</h2>
            <p>Menu phong phú, đặt món nhanh chóng</p>
        </div>

        <!-- ACTIONS -->
        <div class="actions">
            <div class="action-card" id="go-view-order">
                <i data-lucide="list-ordered"></i>
                <h3>Món Đã Gọi</h3>
                <p>Xem danh sách</p>
            </div>

            <div class="action-card" id="go-support">
                <i data-lucide="bell"></i>
                <h3>Gọi Hỗ Trợ</h3>
                <p>Nhân viên phục vụ</p>
            </div>
        </div>

        <!-- SUGGEST -->
        <div class="suggest">
            <div class="suggest-card">
                <div class="suggest-left">
                    <i data-lucide="sparkles"></i>
                    <div>
                        <h4>Combo Bia & Mồi Nhậu</h4>
                        <p>Ưu đãi 15% cho nhóm 4 người</p>
                    </div>
                </div>
                <div>›</div>
            </div>
        </div>

    </div>
</body>

<script>
    document.getElementById("go-menu").onclick = () => {
        window.location.href = "menu.html";
    };

    document.getElementById("go-view-order").onclick = () => {
        window.location.href = "vieworder.html";
    };

    document.getElementById("go-support").onclick = () => {
        alert("Nhân viên sẽ đến hỗ trợ bạn trong giây lát 🙌");
        // sau này đổi thành support.html hoặc gọi API
    };
</script>

<script>
    lucide.createIcons();
</script>

</html>
