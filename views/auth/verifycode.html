<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Macoliz – Guest Check-in</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    /* =====================
       GLOBAL
    ====================== */


    /* =====================
       LAYOUT
    ====================== */
    #app-wrapper {
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #3a124d, #020617);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    #checkin-card {
      width: 100%;
      max-width: 380px;
      /* giới hạn responsive */
      background: rgba(10, 10, 25, 0.65);
      backdrop-filter: blur(20px);
      border-radius: 20px;
      padding: 28px 22px;
      box-shadow: 0 0 40px rgba(255, 0, 200, 0.15);
      text-align: center;
    }

    /* =====================
       LOGO
    ====================== */
    #logo-circle {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      border-radius: 50%;
      background: radial-gradient(circle, #c76bff, #6f2dbd);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 0 20px rgba(200, 100, 255, 0.6);
    }

    #brand-name {
      letter-spacing: 2px;
      font-size: 14px;
      opacity: 0.85;
    }

    /* =====================
       TEXT
    ====================== */
    #welcome-title {
      margin-top: 12px;
    }

    #welcome-subtitle {
      font-size: 14px;
      color: #b9b9d3;
      margin-top: 6px;
    }

    /* =====================
       FORM
    ====================== */
    #checkin-code-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(120, 120, 255, 0.3);
      color: #fff;
      padding: 12px;
      border-radius: 12px;
    }

    #checkin-code-input::placeholder {
      color: #8e8ea9;
    }

    /* =====================
       BUTTON
    ====================== */
    #btn-verify-code {
      margin-top: 24px;
      padding: 14px;
      border-radius: 30px;
      background: linear-gradient(90deg, #ff5ea8, #c77dff);
      border: none;
      font-weight: 600;
      color: #000;
      box-shadow: 0 0 25px rgba(255, 100, 200, 0.6);
      width: 100%;
    }

    #btn-verify-code:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 35px rgba(255, 100, 200, 0.8);
    }

    /* =====================
       FOOTER
    ====================== */
    #help-text {
      margin-top: 20px;
      font-size: 13px;
      color: #aaa;
    }

    #help-link {
      color: #4fc3ff;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div id="app-wrapper">

    <div id="checkin-card">

      <!-- Logo -->
      <div id="logo-circle" aria-label="Macoliz logo">
        🍴
      </div>

      <!-- Brand -->
      <div id="brand-name">MACOLIZ</div>

      <!-- Title -->
      <h4 id="welcome-title">Welcome to Macoliz</h4>
      <p id="welcome-subtitle">
        Làm ơn nhập mã check-in của bạn để tiếp tục
      </p>

      <!-- Input -->
      <div class="mt-4 text-start">
        <label for="checkin-code-input" class="form-label">
          Check-in Code
        </label>
        <input id="checkin-code-input" name="checkinCode" type="text" class="form-control"
          placeholder="Nhập mã check-in của bạn" autocomplete="off">
      </div>

      <!-- Button -->
      <button id="btn-verify-code" type="button">
        Xác nhận mã
      </button>

      <!-- Footer -->
      <div id="help-text">

        <a id="help-link" href="#">
          Gọi hỗ trợ
        </a>
      </div>

    </div>

  </div>

</body>

<script>
  document.getElementById("btn-verify-code").addEventListener("click", function () {
    // TODO: sau này có thể validate code ở đây
    window.location.href = "guest_home.html";
  });
</script>

</html>
