<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Macoliz – Kết thúc phiên</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      font-family: Inter, system-ui
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(circle at top, #3a124d, #020617);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff;
    }

    #app-wrapper {
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
    }


    #page-end {
      width: 390px;
      min-height: 720px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    #icon-done {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at top, #a855f7, #6d28d9);
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 28px;
      box-shadow: 0 0 30px rgba(168, 85, 247, .6);
      margin-bottom: 20px;
    }

    #text-title {
      font-size: 18px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    #text-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #cbd5f5;
      max-width: 280px;
    }

    #btn-home {
      margin-top: 40px;
      padding: 14px 36px;
      border: none;
      border-radius: 30px;
      background: linear-gradient(90deg, #ff5ea0, #ff3d81);
      color: #050014;
      font-weight: 700;
      font-size: 14px;
    }

    #text-footer {
      margin-top: 14px;
      font-size: 11px;
      color: #94a3b8;
    }
  </style>
</head>

<body>

  <div id="app-wrapper">
    <div id="page-end">

      <div id="icon-done">✨</div>

      <div id="text-title">Cảm ơn quý khách đã sử dụng dịch vụ của Macoliz</div>

      <div id="text-desc">
        Chúc quý khách luôn có những khoảnh khắc vui vẻ,<br>
        tràn đầy năng lượng và tiếng cười. 💜
      </div>

      <button id="btn-home">Về trang chủ</button>


    </div>
  </div>


</body>

</html>
